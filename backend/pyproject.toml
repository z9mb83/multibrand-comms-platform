[project]
name = "comms-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.46.0",
  "SQLAlchemy==2.1.0",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "pydantic==2.13.3",
  "pydantic-settings==2.14.0",
  "email-validator==2.3.0",
  "python-multipart==0.0.26",
  "PyJWT[crypto]==2.12.1",
  "bcrypt==5.0.0",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pandas==3.0.2",
  "xlrd==2.0.2",
  "tzdata==2026.4",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Apply database migrations on every Vercel deploy (uses the DATABASE_URL injected by the Neon integration)
build = "python scripts/vercel_build.py"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
