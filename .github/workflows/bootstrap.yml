name: Bootstrap (one-time unpack)

on:
  push:
    paths: [".github/workflows/bootstrap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle into the repository
        run: |
          test -f repo-bundle.tar.gz || { echo "bundle already unpacked"; exit 0; }
          tar -xzf repo-bundle.tar.gz
          git rm -q repo-bundle.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Email Accounts: add Gmail and connect with Google, delete accounts, remove demo accounts; OpenAI key saved in app for AI drafts"
          git push
