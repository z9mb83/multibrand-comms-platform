# Local development stack: Postgres + API (mock providers) + web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/comms
      PROVIDER_MODE: mock
      TASK_BACKEND: inline
      CORS_ORIGINS: http://localhost:3000
      PORT: "8000"
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args: { API_URL: "http://api:8000" }
    environment: { PORT: "3000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
